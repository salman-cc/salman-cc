<svg xmlns="http://www.w3.org/2000/svg" width="880" height="236" viewBox="0 0 880 236" role="img" aria-labelledby="archTitle archDesc">
  <title id="archTitle">Hardware-to-Application Engineering Architecture</title>
  <desc id="archDesc">Four-layer technical architecture diagram spanning Silicon and RTL, Deterministic MCU Firmware, Embedded Linux and Network Protocols, and Vision, Robotics, and Edge AI.</desc>

  <defs>
    <linearGradient id="archBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0D14"/>
      <stop offset="100%" stop-color="#0D111A"/>
    </linearGradient>
    <clipPath id="archClip">
      <rect x="0.5" y="0.5" width="879" height="235" rx="12"/>
    </clipPath>
  </defs>

  <g clip-path="url(#archClip)">
    <rect width="880" height="236" fill="url(#archBg)"/>

    <!-- Header Bar -->
    <line x1="0" y1="42" x2="880" y2="42" stroke="#1B2230" stroke-width="1"/>
    <rect x="24" y="16" width="8" height="8" rx="2" fill="#FF6B35"/>
    <text x="40" y="24.5" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" font-weight="600" letter-spacing="1.1" fill="#CBD5E1">ENGINEERING STACK // SILICON TO AUTONOMOUS SYSTEMS</text>
    <text x="856" y="24.5" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10" fill="#64748B">SIGNAL &amp; CONTROL PIPELINE</text>

    <!-- Connecting Arrows between cards -->
    <g stroke="#FF6B35" stroke-width="1.4" fill="none">
      <line x1="214" y1="136" x2="230" y2="136"/>
      <path d="M 226 132 L 231 136 L 226 140" stroke-linecap="round" stroke-linejoin="round"/>

      <line x1="430" y1="136" x2="446" y2="136"/>
      <path d="M 442 132 L 447 136 L 442 140" stroke-linecap="round" stroke-linejoin="round"/>

      <line x1="646" y1="136" x2="662" y2="136"/>
      <path d="M 658 132 L 663 136 L 658 140" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Layer 01: Hardware & RTL -->
    <g transform="translate(20, 58)">
      <rect width="194" height="156" rx="8" fill="#101520" stroke="#222B3C" stroke-width="1"/>
      <rect x="0" y="0" width="194" height="3" rx="1.5" fill="#FF6B35"/>
      <text x="14" y="24" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.5" font-weight="700" fill="#FF6B35">L0 · HARDWARE &amp; RTL</text>
      <text x="14" y="44" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="700" fill="#F1F5F9">Circuits &amp; Digital Logic</text>
      <line x1="14" y1="55" x2="180" y2="55" stroke="#1D2535" stroke-width="1"/>
      <g font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'DejaVu Sans', sans-serif" font-size="10.5" fill="#94A3B8">
        <text x="14" y="75">· Sensor &amp; ADC Conditioning</text>
        <text x="14" y="95">· Power &amp; Relay Switching</text>
        <text x="14" y="115">· Verilog HDL &amp; Vivado RTL</text>
        <text x="14" y="135">· RMII Ethernet PHY Bring-Up</text>
      </g>
    </g>

    <!-- Layer 02: MCU & RTOS -->
    <g transform="translate(236, 58)">
      <rect width="194" height="156" rx="8" fill="#101520" stroke="#222B3C" stroke-width="1"/>
      <rect x="0" y="0" width="194" height="3" rx="1.5" fill="#FF6B35"/>
      <text x="14" y="24" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.5" font-weight="700" fill="#FF6B35">L1 · MCU &amp; RTOS</text>
      <text x="14" y="44" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="700" fill="#F1F5F9">Deterministic Firmware</text>
      <line x1="14" y1="55" x2="180" y2="55" stroke="#1D2535" stroke-width="1"/>
      <g font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'DejaVu Sans', sans-serif" font-size="10.5" fill="#94A3B8">
        <text x="14" y="75">· STM32H7 Cortex-M7 &amp; ESP32</text>
        <text x="14" y="95">· Azure RTOS ThreadX Tasks</text>
        <text x="14" y="115">· Bare-Metal HAL &amp; DMA Rings</text>
        <text x="14" y="135">· UART, SPI, I2C &amp; PWM Drivers</text>
      </g>
    </g>

    <!-- Layer 03: Embedded Linux & Networking -->
    <g transform="translate(452, 58)">
      <rect width="194" height="156" rx="8" fill="#101520" stroke="#222B3C" stroke-width="1"/>
      <rect x="0" y="0" width="194" height="3" rx="1.5" fill="#FF6B35"/>
      <text x="14" y="24" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.5" font-weight="700" fill="#FF6B35">L2 · LINUX &amp; PROTOCOLS</text>
      <text x="14" y="44" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="700" fill="#F1F5F9">Systems &amp; Transport</text>
      <line x1="14" y1="55" x2="180" y2="55" stroke="#1D2535" stroke-width="1"/>
      <g font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'DejaVu Sans', sans-serif" font-size="10.5" fill="#94A3B8">
        <text x="14" y="75">· V4L2 Capture &amp; H.264 M2M</text>
        <text x="14" y="95">· LwIP &amp; NetX Duo IPv4/IPv6</text>
        <text x="14" y="115">· Pure C WebRTC / DTLS / SRTP</text>
        <text x="14" y="135">· Fedora Linux &amp; Shell Tooling</text>
      </g>
    </g>

    <!-- Layer 04: Perception, Robotics & Edge AI -->
    <g transform="translate(668, 58)">
      <rect width="192" height="156" rx="8" fill="#101520" stroke="#222B3C" stroke-width="1"/>
      <rect x="0" y="0" width="192" height="3" rx="1.5" fill="#FF6B35" fill-opacity="0.65"/>
      <text x="14" y="24" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.5" font-weight="700" fill="#FF8C5A">L3 · ROBOTICS &amp; AI</text>
      <text x="14" y="44" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="700" fill="#F1F5F9">Perception &amp; Control</text>
      <line x1="14" y1="55" x2="178" y2="55" stroke="#1D2535" stroke-width="1"/>
      <g font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'DejaVu Sans', sans-serif" font-size="10.5" fill="#94A3B8">
        <text x="14" y="75">· FPGA Vision Acceleration</text>
        <text x="14" y="95">· ROS 2 Middleware Study</text>
        <text x="14" y="115">· Edge AI &amp; OpenCV Pipelines</text>
        <text x="14" y="135">· IoT Telemetry &amp; Mobile Apps</text>
      </g>
    </g>
  </g>

  <rect x="0.5" y="0.5" width="879" height="235" rx="12" fill="none" stroke="#222938" stroke-width="1"/>
</svg>
