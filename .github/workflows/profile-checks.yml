name: Profile checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile the generator scripts
        run: python3 -m compileall -q .github/scripts

      - name: Validate README structure and SVG assets
        run: python3 .github/scripts/check_readme.py

      - name: Confirm the generators are idempotent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USERNAME: salman-cc
        run: |
          # First run absorbs live GitHub data (counters move with every push).
          python3 .github/scripts/update_activity.py
          python3 .github/scripts/update_repos.py
          git --no-pager diff -- README.md data assets/github-telemetry.svg > /tmp/gen-run1.diff
          # Second run must be a no-op: that is what idempotent means.
          python3 .github/scripts/update_activity.py
          python3 .github/scripts/update_repos.py
          git --no-pager diff -- README.md data assets/github-telemetry.svg > /tmp/gen-run2.diff
          if ! cmp -s /tmp/gen-run1.diff /tmp/gen-run2.diff; then
            echo "::error::Generators are not idempotent: a second run changed the output again."
            git --no-pager diff --stat -- README.md data assets/github-telemetry.svg
            exit 1
          fi
          echo "Generators are idempotent."

      - name: Report unused relative assets
        run: |
          for asset in $(find assets -type f -name '*.svg'); do
            grep -qF "$asset" README.md || { echo "::error::Asset not referenced by README: $asset"; exit 1; }
          done
