name: Refresh profile cards

on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Redraw the contribution cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USERNAME: salman-cc
        run: python3 .github/scripts/render_cards.py

      - name: Commit the refreshed cards
        run: |
          if git diff --quiet -- cards data; then
            echo "Cards are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards data
          git commit -m "chore: refresh profile cards [skip ci]"
          git push
