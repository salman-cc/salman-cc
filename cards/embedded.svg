<svg xmlns="http://www.w3.org/2000/svg" width="270" height="345" viewBox="0 0 270 345"><style>
text{font-family:'Segoe UI','Noto Sans','Helvetica Neue',Arial,sans-serif} .m{font-family:'JetBrains Mono','DejaVu Sans Mono',Consolas,monospace}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.6)}70%{transform:scale(1.06)}100%{opacity:1;transform:scale(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pulse{0%,100%{opacity:1;r:4}50%{opacity:.35;r:6.5}}
@keyframes flow{to{stroke-dashoffset:-40}}
@keyframes swing{0%{opacity:0;transform:translateY(30px) rotate(-3deg)}60%{transform:translateY(-4px) rotate(.6deg)}100%{opacity:1;transform:none}}
@keyframes blink{50%{opacity:0}}
.a{opacity:0;animation:rise .7s cubic-bezier(.2,.8,.2,1) forwards}
.p{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .5s ease-out forwards}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}
</style><rect width="270" height="345" rx="16" fill="#f6f1e7"/><rect x=".5" y=".5" width="269" height="344" rx="16" fill="none" stroke="#d9d2c3"/><rect width="270" height="345" rx="16" fill="#2f5bea"/><g style="opacity:0;transform-box:fill-box;transform-origin:bottom;animation:swing .9s 0.2s cubic-bezier(.2,.8,.2,1) forwards">
<text x="28" y="52" class="m" style="font-family:'JetBrains Mono','DejaVu Sans Mono',Consolas,monospace;font-size:12px;letter-spacing:2px" fill="#ffffff"></text>
<text x="28" y="86" style="font-family:'Instrument Serif','Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif;font-size:27px" fill="#ffffff">Embedded</text>
<rect x="28" y="100" width="46" height="3" rx="1.5" fill="#ffffff"><animate attributeName="width" values="0;46" dur=".8s" begin="0.6000000000000001s" fill="freeze"/></rect><g class="p" style="animation-delay:0.7s"><rect x="28" y="118" width="177.79999999999998" height="28" rx="14" fill="#ffffff" fill-opacity=".92"/><text x="39" y="137" class="m" style="font-family:'JetBrains Mono','DejaVu Sans Mono',Consolas,monospace;font-size:12px" fill="#14181f">STM32 Nucleo H753ZI</text></g><g class="p" style="animation-delay:0.82s"><rect x="28" y="154" width="186.0" height="28" rx="14" fill="#ffffff" fill-opacity=".92"/><text x="39" y="173" class="m" style="font-family:'JetBrains Mono','DejaVu Sans Mono',Consolas,monospace;font-size:12px" fill="#14181f">Raspberry Pi 4, Pi 3</text></g><g class="p" style="animation-delay:0.94s"><rect x="28" y="190" width="153.2" height="28" rx="14" fill="#ffffff" fill-opacity=".92"/><text x="39" y="209" class="m" style="font-family:'JetBrains Mono','DejaVu Sans Mono',Consolas,monospace;font-size:12px" fill="#14181f">ARIES IoT v1, v2</text></g><g class="p" style="animation-delay:1.06s"><rect x="28" y="226" width="63.0" height="28" rx="14" fill="#ffffff" fill-opacity=".92"/><text x="39" y="245" class="m" style="font-family:'JetBrains Mono','DejaVu Sans Mono',Consolas,monospace;font-size:12px" fill="#14181f">ESP32</text></g><g class="p" style="animation-delay:1.18s"><rect x="99.0" y="226" width="128.6" height="28" rx="14" fill="#ffffff" fill-opacity=".92"/><text x="110.0" y="245" class="m" style="font-family:'JetBrains Mono','DejaVu Sans Mono',Consolas,monospace;font-size:12px" fill="#14181f">Intel Galileo</text></g><g class="p" style="animation-delay:1.2999999999999998s"><rect x="28" y="262" width="210.6" height="28" rx="14" fill="#ffffff" fill-opacity=".92"/><text x="39" y="281" class="m" style="font-family:'JetBrains Mono','DejaVu Sans Mono',Consolas,monospace;font-size:12px" fill="#14181f">Arduino Uno, Nano, Mega</text></g><g class="p" style="animation-delay:1.42s"><rect x="28" y="298" width="145.0" height="28" rx="14" fill="#ffffff" fill-opacity=".92"/><text x="39" y="317" class="m" style="font-family:'JetBrains Mono','DejaVu Sans Mono',Consolas,monospace;font-size:12px" fill="#14181f">NodeMCU ESP8266</text></g></g></svg>
