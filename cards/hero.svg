<svg xmlns="http://www.w3.org/2000/svg" width="830" height="250" viewBox="0 0 830 250"><style>
text{font-family:'Segoe UI','Noto Sans','Helvetica Neue',Arial,sans-serif} .m{font-family:'JetBrains Mono','DejaVu Sans Mono',Consolas,monospace}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.6)}70%{transform:scale(1.06)}100%{opacity:1;transform:scale(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pulse{0%,100%{opacity:1;r:4}50%{opacity:.35;r:6.5}}
@keyframes flow{to{stroke-dashoffset:-40}}
@keyframes swing{0%{opacity:0;transform:translateY(30px) rotate(-3deg)}60%{transform:translateY(-4px) rotate(.6deg)}100%{opacity:1;transform:none}}
@keyframes blink{50%{opacity:0}}
.a{opacity:0;animation:rise .7s cubic-bezier(.2,.8,.2,1) forwards}
.p{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .5s ease-out forwards}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}
*{animation:none!important;opacity:1!important;transform:none!important;stroke-dashoffset:0!important}</style><rect width="830" height="250" rx="16" fill="#f6f1e7"/><rect x=".5" y=".5" width="829" height="249" rx="16" fill="none" stroke="#d9d2c3"/>
<g class="a" style="animation-delay:.1s"><text x="48" y="64" class="m" style="font-family:'JetBrains Mono','DejaVu Sans Mono',Consolas,monospace;font-size:14px" fill="#2f5bea">hello, i am</text></g>
<g class="a" style="animation-delay:.3s"><text x="48" y="118" style="font-family:'Instrument Serif','Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif;font-size:62px" fill="#14181f">Muhammed Salman</text></g>
<defs><linearGradient id="sh" gradientUnits="userSpaceOnUse" x1="-200" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#2f5bea" stop-opacity="0"/><stop offset=".5" stop-color="#2f5bea"/><stop offset="1" stop-color="#2f5bea" stop-opacity="0"/><animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="700 0" dur="4s" begin="1.5s" repeatCount="indefinite"/></linearGradient></defs>
<g class="a" style="animation-delay:.5s"><text x="48" y="118" style="font-family:'Instrument Serif','Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif;font-size:62px" fill="url(#sh)">Muhammed Salman</text></g>
<g class="a" style="animation-delay:.7s"><text x="48" y="156" style="font-size:20px" fill="#14181f">Embedded systems and FPGA developer</text></g>
<g class="a" style="animation-delay:.9s"><text x="48" y="186" style="font-size:15px" fill="#5b6270">M.Sc. Electronics. Firmware in C, hardware in Verilog.</text></g>
<g class="a" style="animation-delay:1.1s"><circle cx="54" cy="216" r="4" fill="#2f5bea" style="animation:pulse 2s ease-in-out infinite"/><text x="68" y="221" class="m" style="font-family:'JetBrains Mono','DejaVu Sans Mono',Consolas,monospace;font-size:13px" fill="#5b6270">on Fedora + KDE Plasma</text></g>
<path d="M660 70 H700 L720 90 H790" fill="none" stroke="#2f5bea" stroke-opacity=".55" stroke-width="2" stroke-dasharray="400" stroke-dashoffset="400" style="animation:draw 1.8s 0.4s ease-out forwards"/><path d="M660 110 H690 L710 130 H800" fill="none" stroke="#2f5bea" stroke-opacity=".55" stroke-width="2" stroke-dasharray="400" stroke-dashoffset="400" style="animation:draw 1.8s 0.65s ease-out forwards"/><path d="M660 150 H690 V180 H760 L780 160 H800" fill="none" stroke="#2f5bea" stroke-opacity=".55" stroke-width="2" stroke-dasharray="400" stroke-dashoffset="400" style="animation:draw 1.8s 0.9s ease-out forwards"/><path d="M660 190 H680 V220 H740" fill="none" stroke="#2f5bea" stroke-opacity=".55" stroke-width="2" stroke-dasharray="400" stroke-dashoffset="400" style="animation:draw 1.8s 1.15s ease-out forwards"/><path d="M690 40 V24 H790" fill="none" stroke="#2f5bea" stroke-opacity=".55" stroke-width="2" stroke-dasharray="400" stroke-dashoffset="400" style="animation:draw 1.8s 1.4s ease-out forwards"/><g class="p" style="animation-delay:.2s"><rect x="590" y="96" width="70" height="70" rx="8" fill="#ffffff" stroke="#2f5bea" stroke-width="2"/><text x="625" y="138" text-anchor="middle" class="m" style="font-family:'JetBrains Mono','DejaVu Sans Mono',Consolas,monospace;font-size:15px;font-weight:700" fill="#2f5bea">MCU</text></g><circle class="p" cx="790" cy="90" r="5" fill="#2f5bea" style="animation-delay:1.2s"/><circle class="p" cx="800" cy="130" r="5" fill="#2f5bea" style="animation-delay:1.4s"/><circle class="p" cx="800" cy="160" r="5" fill="#2f5bea" style="animation-delay:1.6s"/><circle class="p" cx="740" cy="220" r="5" fill="#2f5bea" style="animation-delay:1.8s"/><circle class="p" cx="790" cy="24" r="5" fill="#2f5bea" style="animation-delay:2.0s"/></svg>
