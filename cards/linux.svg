<svg xmlns="http://www.w3.org/2000/svg" width="270" height="250" viewBox="0 0 270 250"><style>
text{font-family:'Segoe UI','Noto Sans','Helvetica Neue',Arial,sans-serif} .m{font-family:'JetBrains Mono','DejaVu Sans Mono',Consolas,monospace}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.6)}70%{transform:scale(1.06)}100%{opacity:1;transform:scale(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pulse{0%,100%{opacity:1;r:4}50%{opacity:.35;r:6.5}}
@keyframes flow{to{stroke-dashoffset:-40}}
@keyframes swing{0%{opacity:0;transform:translateY(30px) rotate(-3deg)}60%{transform:translateY(-4px) rotate(.6deg)}100%{opacity:1;transform:none}}
@keyframes blink{50%{opacity:0}}
.a{opacity:0;animation:rise .7s cubic-bezier(.2,.8,.2,1) forwards}
.p{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .5s ease-out forwards}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}
</style><rect width="270" height="250" rx="16" fill="#f6f1e7"/><rect x=".5" y=".5" width="269" height="249" rx="16" fill="none" stroke="#d9d2c3"/><rect width="270" height="250" rx="16" fill="#f5c518"/><g style="opacity:0;transform-box:fill-box;transform-origin:bottom;animation:swing .9s 0.7s cubic-bezier(.2,.8,.2,1) forwards">
<text x="28" y="52" class="m" style="font-family:'JetBrains Mono','DejaVu Sans Mono',Consolas,monospace;font-size:12px;letter-spacing:2px" fill="#14181f">LINUX</text>
<text x="28" y="86" style="font-family:'Instrument Serif','Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif;font-size:32px" fill="#14181f">Daily driver</text>
<rect x="28" y="100" width="46" height="3" rx="1.5" fill="#14181f"><animate attributeName="width" values="0;46" dur=".8s" begin="1.1s" fill="freeze"/></rect><g class="p" style="animation-delay:1.2s"><rect x="28" y="118" width="71.19999999999999" height="28" rx="14" fill="#ffffff" fill-opacity=".92"/><text x="39" y="137" class="m" style="font-family:'JetBrains Mono','DejaVu Sans Mono',Consolas,monospace;font-size:12px" fill="#14181f">Fedora</text></g><g class="p" style="animation-delay:1.3199999999999998s"><rect x="107.19999999999999" y="118" width="104.0" height="28" rx="14" fill="#ffffff" fill-opacity=".92"/><text x="118.19999999999999" y="137" class="m" style="font-family:'JetBrains Mono','DejaVu Sans Mono',Consolas,monospace;font-size:12px" fill="#14181f">KDE Plasma</text></g><g class="p" style="animation-delay:1.44s"><rect x="28" y="154" width="46.599999999999994" height="28" rx="14" fill="#ffffff" fill-opacity=".92"/><text x="39" y="173" class="m" style="font-family:'JetBrains Mono','DejaVu Sans Mono',Consolas,monospace;font-size:12px" fill="#14181f">Git</text></g><g class="p" style="animation-delay:1.56s"><rect x="82.6" y="154" width="79.39999999999999" height="28" rx="14" fill="#ffffff" fill-opacity=".92"/><text x="93.6" y="173" class="m" style="font-family:'JetBrains Mono','DejaVu Sans Mono',Consolas,monospace;font-size:12px" fill="#14181f">VS Code</text></g><g class="p" style="animation-delay:1.68s"><rect x="170.0" y="154" width="71.19999999999999" height="28" rx="14" fill="#ffffff" fill-opacity=".92"/><text x="181.0" y="173" class="m" style="font-family:'JetBrains Mono','DejaVu Sans Mono',Consolas,monospace;font-size:12px" fill="#14181f">Python</text></g></g></svg>
