<svg xmlns="http://www.w3.org/2000/svg" width="830" height="110" viewBox="0 0 830 110"><style>
text{font-family:'Segoe UI','Noto Sans','Helvetica Neue',Arial,sans-serif} .m{font-family:'JetBrains Mono','DejaVu Sans Mono',Consolas,monospace}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.6)}70%{transform:scale(1.06)}100%{opacity:1;transform:scale(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pulse{0%,100%{opacity:1;r:4}50%{opacity:.35;r:6.5}}
@keyframes flow{to{stroke-dashoffset:-40}}
@keyframes swing{0%{opacity:0;transform:translateY(30px) rotate(-3deg)}60%{transform:translateY(-4px) rotate(.6deg)}100%{opacity:1;transform:none}}
@keyframes blink{50%{opacity:0}}
.a{opacity:0;animation:rise .7s cubic-bezier(.2,.8,.2,1) forwards}
.p{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .5s ease-out forwards}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}
</style><rect width="830" height="110" rx="16" fill="#f6f1e7"/><rect x=".5" y=".5" width="829" height="109" rx="16" fill="none" stroke="#d9d2c3"/><rect width="830" height="110" rx="16" fill="#14181f"/><g class="a"><text x="28" y="42" class="m" style="font-family:'JetBrains Mono','DejaVu Sans Mono',Consolas,monospace;font-size:12px;letter-spacing:2px" fill="#ffffff" fill-opacity=".7">ELECTRONICS SOFTWARE</text><text x="28" y="82" style="font-family:'Instrument Serif','Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif;font-size:30px" fill="#ffffff">Signal processing</text></g><g class="p" style="animation-delay:0.6s"><rect x="300" y="56" width="108.0" height="30" rx="15" fill="#ffffff"/><text x="354.0" y="76" text-anchor="middle" class="m" style="font-family:'JetBrains Mono','DejaVu Sans Mono',Consolas,monospace;font-size:12px" fill="#14181f">Radioconda</text></g><g class="p" style="animation-delay:0.75s"><rect x="418.0" y="56" width="50.599999999999994" height="30" rx="15" fill="#ffffff"/><text x="443.3" y="76" text-anchor="middle" class="m" style="font-family:'JetBrains Mono','DejaVu Sans Mono',Consolas,monospace;font-size:12px" fill="#14181f">Git</text></g><g class="p" style="animation-delay:0.8999999999999999s"><rect x="478.6" y="56" width="83.39999999999999" height="30" rx="15" fill="#ffffff"/><text x="520.3000000000001" y="76" text-anchor="middle" class="m" style="font-family:'JetBrains Mono','DejaVu Sans Mono',Consolas,monospace;font-size:12px" fill="#14181f">VS Code</text></g></svg>
