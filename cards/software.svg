<svg xmlns="http://www.w3.org/2000/svg" width="830" height="130" viewBox="0 0 830 130"><style>
text{font-family:'Segoe UI','Noto Sans','Helvetica Neue',Arial,sans-serif} .m{font-family:'JetBrains Mono','DejaVu Sans Mono',Consolas,monospace}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.6)}70%{transform:scale(1.06)}100%{opacity:1;transform:scale(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pulse{0%,100%{opacity:1;r:4}50%{opacity:.35;r:6.5}}
@keyframes flow{to{stroke-dashoffset:-40}}
@keyframes swing{0%{opacity:0;transform:translateY(30px) rotate(-3deg)}60%{transform:translateY(-4px) rotate(.6deg)}100%{opacity:1;transform:none}}
@keyframes blink{50%{opacity:0}}
.a{opacity:0;animation:rise .7s cubic-bezier(.2,.8,.2,1) forwards}
.p{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .5s ease-out forwards}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}
</style><rect width="830" height="130" rx="16" fill="#f6f1e7"/><rect x=".5" y=".5" width="829" height="129" rx="16" fill="none" stroke="#d9d2c3"/><rect width="830" height="130" rx="16" fill="#14181f"/><g class="a"><text x="28" y="42" class="m" style="font-family:'JetBrains Mono','DejaVu Sans Mono',Consolas,monospace;font-size:12px;letter-spacing:2px" fill="#ffffff" fill-opacity=".7">SOFTWARE</text><text x="28" y="82" style="font-family:'Instrument Serif','Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif;font-size:30px" fill="#ffffff">Tools</text></g><g class="p" style="animation-delay:0.6s"><rect x="200" y="42" width="83.39999999999999" height="30" rx="15" fill="#ffffff"/><text x="241.7" y="62" text-anchor="middle" class="m" style="font-family:'JetBrains Mono','DejaVu Sans Mono',Consolas,monospace;font-size:12px" fill="#14181f">VS Code</text></g><g class="p" style="animation-delay:0.72s"><rect x="293.4" y="42" width="75.19999999999999" height="30" rx="15" fill="#ffffff"/><text x="331.0" y="62" text-anchor="middle" class="m" style="font-family:'JetBrains Mono','DejaVu Sans Mono',Consolas,monospace;font-size:12px" fill="#14181f">GitHub</text></g><g class="p" style="animation-delay:0.84s"><rect x="378.59999999999997" y="42" width="116.19999999999999" height="30" rx="15" fill="#ffffff"/><text x="436.69999999999993" y="62" text-anchor="middle" class="m" style="font-family:'JetBrains Mono','DejaVu Sans Mono',Consolas,monospace;font-size:12px" fill="#14181f">Arduino IDE</text></g><g class="p" style="animation-delay:0.96s"><rect x="504.79999999999995" y="42" width="124.39999999999999" height="30" rx="15" fill="#ffffff"/><text x="567.0" y="62" text-anchor="middle" class="m" style="font-family:'JetBrains Mono','DejaVu Sans Mono',Consolas,monospace;font-size:12px" fill="#14181f">STM32CubeIDE</text></g><g class="p" style="animation-delay:1.08s"><rect x="639.1999999999999" y="42" width="116.19999999999999" height="30" rx="15" fill="#ffffff"/><text x=